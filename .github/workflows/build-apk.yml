name: Gerar APK Android — KAMY Music Player

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar KAMY APK (100% Offline)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java JDK 21 ( exigido pelo Android Gradle )
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar dependências e compilar o KAMY Offline Bundle
        run: |
          npm install
          npm run build

      - name: 6. Empacotar projeto Android Nativo e gerar APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Renomear APK final para KAMY-Music-Player.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./KAMY-Music-Player.apk

      - name: 8. Disponibilizar APK para Download no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: KAMY-Music-Player-APK
          path: ./KAMY-Music-Player.apk
          if-no-files-found: error
